[env:esp32s3]
platform = espressif32@6.9.0 ; espressif framework version we are using
board = esp32-s3-devkitc-1
board_build.partitions = ricparts3.csv ; custom partition map
framework = espidf
lib_compat_mode = off ; we are using arduino as a component, so if we dont turn off lib compatibility check, arduino libraries in /lib wont be included
build_flags =
  -std=gnu++20 ; c++ version set to c++20
  -D ARDUINO=100
  -DESP32=1
    -DARDUINO_ARCH_ESP32=1
  -DARDUINO_USB_CDC_ON_BOOT=1 ; required to select the usb serial/jtag interface

board_build.embed_txtfiles = ; certs required by managed components pulled in by arduino-esp32
  managed_components/espressif__esp_insights/server_certs/https_server.crt
  managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
  managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
  managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
